name: Deploy Studyspace Monitor

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Report dependency audit
        run: |
          npm audit --json > audit-all.json || true
          npm audit --omit=dev --json > audit-production.json || true
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          for (const [label, file] of [['all dependencies', 'audit-all.json'], ['production dependencies', 'audit-production.json']]) {
            const report = JSON.parse(readFileSync(file, 'utf8'))
            const vulnerabilities = Object.entries(report.vulnerabilities || {})
            console.log(label + ': ' + vulnerabilities.length + ' vulnerable package(s)')
            for (const [name, item] of vulnerabilities) {
              const titles = (item.via || []).filter(value => typeof value === 'object').map(value => value.title).join('; ')
              console.log(' - ' + name + ' [' + item.severity + '] direct=' + item.isDirect + ' fix=' + JSON.stringify(item.fixAvailable) + (titles ? ' ' + titles : ''))
            }
          }
          const production = JSON.parse(readFileSync('audit-production.json', 'utf8'))
          const productionVulnerabilities = Object.entries(production.vulnerabilities || {})
          if (productionVulnerabilities.length > 0) {
            console.error('Production dependency audit failed: ' + productionVulnerabilities.length + ' vulnerable package(s).')
            process.exitCode = 1
          } else {
            console.log('Production dependency audit passed: no vulnerable production packages.')
          }
          NODE
      - name: Validate Supabase frontend configuration
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          node --input-type=module <<'NODE'
          const url = process.env.VITE_SUPABASE_URL?.trim()
          const key = process.env.VITE_SUPABASE_PUBLISHABLE_KEY?.trim()

          if (!url || !key) {
            throw new Error('Missing VITE_SUPABASE_URL or public Supabase API key. Check GitHub Actions Variables.')
          }

          let parsedUrl
          try {
            parsedUrl = new URL(url)
          } catch {
            throw new Error('VITE_SUPABASE_URL is not a valid URL.')
          }

          if (parsedUrl.protocol !== 'https:' || parsedUrl.hostname !== 'tibcoottzstnqkfpwabk.supabase.co') {
            throw new Error('VITE_SUPABASE_URL does not match the configured Studyspace production project.')
          }

          const isPublishableKey = /^sb_publishable_[A-Za-z0-9_-]{20,}$/.test(key)
          const isLegacyAnonJwt = /^eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$/.test(key)
          if (!isPublishableKey && !isLegacyAnonJwt) {
            throw new Error('The Supabase public key is missing or has an unsupported format. Copy the complete publishable key from the correct project.')
          }

          console.log('Supabase project URL and public-key format validated. Key value was not printed.')
          NODE
      - name: Verify assessment Edge Function authentication
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          node --input-type=module <<'NODE'
          const url = process.env.VITE_SUPABASE_URL?.trim()
          const key = process.env.VITE_SUPABASE_PUBLISHABLE_KEY?.trim()
          const endpoint = url + '/functions/v1/submit-exercise-attempt'
          const commonHeaders = {
            apikey: key,
            'Content-Type': 'application/json',
            Origin: 'https://mayendzeke.github.io',
          }

          const missingToken = await fetch(endpoint, {
            method: 'POST',
            headers: commonHeaders,
            body: JSON.stringify({}),
          })
          const missingBody = await missingToken.text()
          let missingPayload
          try { missingPayload = JSON.parse(missingBody) } catch { missingPayload = null }
          if (missingToken.status !== 401 || missingPayload?.error !== 'Sign in is required.') {
            throw new Error('Assessment function expected its missing-token HTTP 401 response, received HTTP ' + missingToken.status + ': ' + missingBody.slice(0, 180))
          }

          const invalidToken = await fetch(endpoint, {
            method: 'POST',
            headers: { ...commonHeaders, Authorization: 'Bearer invalid.invalid.invalid' },
            body: JSON.stringify({}),
          })
          if (invalidToken.status !== 401) {
            const detail = (await invalidToken.text()).slice(0, 180)
            throw new Error('Assessment function must reject invalid JWTs with HTTP 401, received HTTP ' + invalidToken.status + ': ' + detail)
          }

          console.log('Assessment endpoint is deployed; missing and invalid learner credentials are rejected with HTTP 401.')
          NODE
      - name: Verify learner account management requires authentication
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          node --input-type=module <<'NODE'
          const url = process.env.VITE_SUPABASE_URL?.trim()
          const key = process.env.VITE_SUPABASE_PUBLISHABLE_KEY?.trim()
          const endpoint = url + '/functions/v1/manage-learner-account'
          const headers = {
            apikey: key,
            'Content-Type': 'application/json',
            Origin: 'https://mayendzeke.github.io',
          }

          const missingToken = await fetch(endpoint, {
            method: 'POST',
            headers,
            body: JSON.stringify({ learnerId: '00000000-0000-4000-8000-000000000000', action: 'delete' }),
          })
          if (missingToken.status !== 401) {
            const detail = (await missingToken.text()).slice(0, 180)
            throw new Error('Learner management must reject missing credentials with HTTP 401, received HTTP ' + missingToken.status + ': ' + detail)
          }

          const invalidToken = await fetch(endpoint, {
            method: 'POST',
            headers: { ...headers, Authorization: 'Bearer invalid.invalid.invalid' },
            body: JSON.stringify({ learnerId: '00000000-0000-4000-8000-000000000000', action: 'delete' }),
          })
          if (invalidToken.status !== 401) {
            const detail = (await invalidToken.text()).slice(0, 180)
            throw new Error('Learner management must reject invalid credentials with HTTP 401, received HTTP ' + invalidToken.status + ': ' + detail)
          }

          console.log('Learner account management rejects both missing and invalid authentication tokens.')
          NODE
      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || vars.VITE_SUPABASE_ANON_KEY }}
          VITE_STUDYSPACE_MEET_DOMAIN: ${{ vars.STUDYSPACE_MEET_DOMAIN }}
          VITE_STUDYSPACE_PUBLIC_ENROLMENT_ENABLED: 'true'
          VITE_STUDYSPACE_ADMIN_MIA_ENABLED: 'true'
        run: npm run build
      - name: Verify Monitor PWA and MIA lesson handoff
        run: |
          node --input-type=module <<'NODE'
          import { existsSync, readFileSync, readdirSync } from 'node:fs'
          import { join } from 'node:path'

          const files = readdirSync('dist')
          const manifestName = files.find(name => name.endsWith('.webmanifest'))
          if (!manifestName) throw new Error('The PWA web app manifest was not generated.')
          const manifest = JSON.parse(readFileSync(join('dist', manifestName), 'utf8'))
          if (manifest.name !== 'Studyspace Monitor' || manifest.start_url !== '/studyspace-monitor/' || manifest.scope !== '/studyspace-monitor/') {
            throw new Error('The Monitor PWA manifest has an unexpected app name, start URL or scope.')
          }
          if (!Array.isArray(manifest.icons) || !manifest.icons.length) throw new Error('The PWA manifest has no app icons.')
          for (const icon of manifest.icons) {
            const relative = String(icon.src).replace('/studyspace-monitor/', '')
            if (!existsSync(join('dist', relative))) throw new Error('A declared PWA icon is missing from the build: ' + icon.src)
          }
          if (!files.includes('sw.js')) throw new Error('The offline service worker was not generated.')
          const app = readFileSync('src/App.tsx', 'utf8')
          const mia = readFileSync('src/components/MiaStudio.tsx', 'utf8')
          const classroom = readFileSync('src/components/ClassroomStudio.tsx', 'utf8')
          if (!app.includes('beforeinstallprompt') || !app.includes('monitor-install-button')) throw new Error('The Monitor install control is missing.')
          if (!mia.includes('studyspace-monitor-mia-lesson-handoff-v1') || !mia.includes('studyspace-open-classroom-studio')) throw new Error('MIA lesson handoff is incomplete.')
          if (!classroom.includes('studyspace-monitor-mia-lesson-handoff-v1') || !classroom.includes('studyspace-open-classroom-studio')) throw new Error('Classroom Studio lesson handoff receiver is incomplete.')
          if (!classroom.includes("extractSection('Learning objectives')") || !classroom.includes("extractSection('Homework')")) throw new Error('MIA lesson sections are not mapped into editable Classroom Studio fields.')
          const termsVersion = '2026-11-07-v3'
          for (const path of ['supabase/functions/jaas-token/index.ts', 'supabase/functions/submit-exercise-attempt/index.ts']) {
            const source = readFileSync(path, 'utf8')
            if (!source.includes(termsVersion)) throw new Error(path + ' does not enforce the current StudySpace terms version.')
            if (source.includes('2026-11-07-v1')) throw new Error(path + ' still contains a stale StudySpace terms-version check.')
          }
          const enrolment = readFileSync('supabase/functions/enrol-learner/index.ts', 'utf8')
          if (!enrolment.includes(termsVersion)) throw new Error('Learner enrolment does not record the current StudySpace terms version.')
          const capacityMigration = readFileSync('supabase/migrations/20261108070909_studyspace_enrolment_capacity.sql', 'utf8')
          if (!capacityMigration.includes("interval '48 hours'")) throw new Error('The learner trial must last exactly 48 hours.')
          if (!enrolment.includes('complete_studyspace_enrolment')) throw new Error('Learner enrolment must start its 48-hour trial through the database transaction.')
          const pinCreation = readFileSync('supabase/functions/create-enrolment-pin/index.ts', 'utf8')
          if (!pinCreation.includes('24 * 60 * 60 * 1000')) throw new Error('New enrolment PINs must expire after exactly 24 hours.')
          if (!pinCreation.includes('studyspace_enrolment_capacity_available')) throw new Error('PIN creation must verify the server-side enrolment limit.')
          if (!enrolment.includes('complete_studyspace_enrolment')) throw new Error('Learner enrolment must atomically enforce the 100-account limit.')
          const accountManagement = readFileSync('supabase/functions/manage-learner-account/index.ts', 'utf8')
          const learnerAdminPage = readFileSync('src/components/LearnersPage.tsx', 'utf8')
          if (!accountManagement.includes('paymentTransactionReference') || !accountManagement.includes('payment_transaction_reference')) throw new Error('Subscription audit must require and retain the MTN MoMo transaction reference.')
          if (!learnerAdminPage.includes('MTN MoMo transaction reference') || !learnerAdminPage.includes('paymentTransactionReference.trim().length < 4')) throw new Error('Monitor must collect a transaction reference before confirming payment.')
          if (!accountManagement.includes('payment_transaction_reference') || !accountManagement.includes('already been used')) throw new Error('Subscription activation must audit and reject reused MTN MoMo transaction references.')
          const paymentReferenceMigration = readFileSync('supabase/migrations/20261108070904_studyspace_unique_payment_transaction_references.sql', 'utf8')
          if (!paymentReferenceMigration.includes('create unique index') || !paymentReferenceMigration.includes('payment_transaction_reference')) throw new Error('The database must prevent reuse of a payment transaction reference.')
          for (const path of ['supabase/functions/mia-monitor-assistant/index.ts', 'supabase/functions/generate-lesson-recap/index.ts']) {
            const source = readFileSync(path, 'utf8')
            if (!source.includes('GEMINI_API_KEY') || !source.includes('gemini-3.8-flash') || !source.includes('generativelanguage.googleapis.com')) {
              throw new Error(path + ' must use the configured Gemini API key and supported model.')
            }
            if (!source.includes('aal2') || !source.includes('profile?.role !== "admin"')) {
              throw new Error(path + ' must enforce administrator role and MFA.')
            }
            if (!source.includes('mia_admin_request')) throw new Error(path + ' must enforce and audit administrator AI usage.')
          }
          console.log('Gemini integration, administrator role, MFA and AI usage audit checks passed.')
          const migration = readFileSync('supabase/migrations/20261108070859_universal_trial_and_terms_acceptance.sql', 'utf8')
          if (!/security invoker/i.test(migration)) throw new Error('The learner access helper must run with invoker privileges.')
          if (!migration.includes('trial_started_at <= now()')) throw new Error('Database access must not begin before the trial start time.')
          if (!migration.includes("terms_version = '2026-11-07-v3'")) throw new Error('Database access must require the current Terms version.')
          console.log('Database trial-start, invoker-security and current-terms guards passed.')
          console.log('Current terms-version checks passed for enrolment, class access and assessment submission.')
          console.log('Monitor PWA manifest, icon, service worker and MIA-to-Classroom handoff checks passed.')
          NODE
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
