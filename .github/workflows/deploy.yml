name: Deploy Studyspace Monitor

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Validate Supabase frontend configuration
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          node --input-type=module <<'NODE'
          const url = process.env.VITE_SUPABASE_URL?.trim()
          const key = process.env.VITE_SUPABASE_PUBLISHABLE_KEY?.trim()

          if (!url || !key) {
            throw new Error('Missing VITE_SUPABASE_URL or public Supabase API key. Check GitHub Actions Variables.')
          }

          let parsedUrl
          try {
            parsedUrl = new URL(url)
          } catch {
            throw new Error('VITE_SUPABASE_URL is not a valid URL.')
          }

          if (parsedUrl.protocol !== 'https:' || parsedUrl.hostname !== 'tibcoottzstnqkfpwabk.supabase.co') {
            throw new Error('VITE_SUPABASE_URL does not match the configured Studyspace production project.')
          }

          const isPublishableKey = /^sb_publishable_[A-Za-z0-9_-]{20,}$/.test(key)
          const isLegacyAnonJwt = /^eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$/.test(key)
          if (!isPublishableKey && !isLegacyAnonJwt) {
            throw new Error('The Supabase public key is missing or has an unsupported format. Copy the complete publishable key from the correct project.')
          }

          console.log('Supabase project URL and public-key format validated. Key value was not printed.')
          NODE
      - name: Verify assessment Edge Function rejects invalid session tokens
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          node --input-type=module <<'NODE'
          const url = process.env.VITE_SUPABASE_URL?.trim()
          const key = process.env.VITE_SUPABASE_PUBLISHABLE_KEY?.trim()
          const response = await fetch(url + '/functions/v1/submit-exercise-attempt', {
            method: 'POST',
            headers: {
              apikey: key,
              Authorization: 'Bearer invalid.invalid.invalid',
              'Content-Type': 'application/json',
              Origin: 'https://mayendzeke.github.io',
            },
            body: JSON.stringify({}),
          })
          const responseBody = await response.text()
          let payload
          try { payload = JSON.parse(responseBody) } catch { payload = null }
          if (response.status !== 401 || payload?.error !== 'Sign in is required.') {
            const detail = responseBody.slice(0, 180)
            throw new Error('submit-exercise-attempt expected HTTP 401 for an invalid learner token, received HTTP ' + response.status + ': ' + detail)
          }
          console.log('submit-exercise-attempt is deployed and correctly rejects requests with an invalid learner token.')
          NODE
      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || vars.VITE_SUPABASE_ANON_KEY }}
        run: npm run build
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
