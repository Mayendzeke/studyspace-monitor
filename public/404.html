<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(ellipse at 50% 10%,rgba(126,111,228,.18),transparent 56%),linear-gradient(145deg,#f4f5fb,#e5eaf5);font-family:system-ui,sans-serif;color:#26324b}

.illustration{width:190px;height:142px;margin:0 auto 7px;position:relative;animation:float 3.7s ease-in-out infinite}
.screen{position:absolute;left:20px;top:19px;width:150px;height:92px;border:8px solid #5b4db8;border-radius:15px;background:linear-gradient(140deg,#f5f1ff,#dff6f0);box-shadow:12px 12px 0 #c6bee9,0 18px 36px rgba(76,61,153,.18);transform:perspective(300px) rotateY(-9deg) rotateX(4deg)}
.screen:before{content:"";position:absolute;left:10px;right:10px;top:12px;height:7px;border-radius:8px;background:#d5ccfa;box-shadow:0 16px 0 #dceeea,0 32px 0 #e9e3fa}
.screen:after{content:"";position:absolute;left:10px;bottom:8px;width:49px;height:7px;border-radius:8px;background:#7c68d5}
.stand{position:absolute;left:87px;top:110px;width:25px;height:19px;background:linear-gradient(90deg,#6a5bc1,#a89ce5);clip-path:polygon(25% 0,75% 0,100% 100%,0 100%)}

.spark{position:absolute;color:#7965cd;font-size:24px;animation:twinkle 2s ease-in-out infinite}.spark.one{top:4px;left:8px}.spark.two{top:35px;right:3px;animation-delay:.7s}
.code{font-size:clamp(58px,15vw,82px);font-weight:900;line-height:1;letter-spacing:-5px;color:#6d5ac4;margin:7px 0 10px}
h1{font-size:clamp(23px,6vw,31px);letter-spacing:-1px;margin:0 0 10px}p{max-width:420px;margin:0 auto;color:#727c93;font-size:14px;line-height:1.7}
.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:27px}a{min-height:44px;padding:0 18px;display:inline-flex;align-items:center;justify-content:center;border-radius:12px;text-decoration:none;font-weight:750;font-size:12px}
.primary{color:white;background:linear-gradient(135deg,#8a77e8,#5b48be);box-shadow:0 10px 24px rgba(92,73,195,.2)}.secondary{color:#6557a1;border:1px solid rgba(99,86,168,.17);background:rgba(255,255,255,.65)}
small{display:block;margin-top:24px;color:#9995ac;font-size:10px}
@keyframes float{50%{transform:translateY(-10px) rotate(-1deg)}}@keyframes twinkle{50%{opacity:.35;transform:scale(.7) rotate(24deg)}}
@media(max-width:420px){.card{padding:27px 19px}.actions{display:grid}.actions a{width:100%}}@media(prefers-reduced-motion:reduce){.illustration,.spark{animation:none}}
</style></head>
