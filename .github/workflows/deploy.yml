name: Deploy Studyspace Monitor

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Validate Supabase frontend configuration
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          node --input-type=module <<'NODE'
          const url = process.env.VITE_SUPABASE_URL?.trim()
          const key = process.env.VITE_SUPABASE_PUBLISHABLE_KEY?.trim()

          if (!url || !key) {
            throw new Error('Missing VITE_SUPABASE_URL or public Supabase API key. Check GitHub Actions Variables.')
          }

          let parsedUrl
          try {
            parsedUrl = new URL(url)
          } catch {
            throw new Error('VITE_SUPABASE_URL is not a valid URL.')
          }

          if (parsedUrl.protocol !== 'https:' || parsedUrl.hostname !== 'tibcoottzstnqkfpwabk.supabase.co') {
            throw new Error('VITE_SUPABASE_URL does not match the configured Studyspace production project.')
          }

          const isPublishableKey = /^sb_publishable_[A-Za-z0-9_-]{20,}$/.test(key)
          const isLegacyAnonJwt = /^eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$/.test(key)
          if (!isPublishableKey && !isLegacyAnonJwt) {
            throw new Error('The Supabase public key is missing or has an unsupported format. Copy the complete publishable key from the correct project.')
          }

          console.log('Supabase project URL and public-key format validated. Key value was not printed.')
          NODE
      - name: Verify assessment Edge Function authentication
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          node --input-type=module <<'NODE'
          const url = process.env.VITE_SUPABASE_URL?.trim()
          const key = process.env.VITE_SUPABASE_PUBLISHABLE_KEY?.trim()
          const endpoint = url + '/functions/v1/submit-exercise-attempt'
          const commonHeaders = {
            apikey: key,
            'Content-Type': 'application/json',
            Origin: 'https://mayendzeke.github.io',
          }

          const missingToken = await fetch(endpoint, {
            method: 'POST',
            headers: commonHeaders,
            body: JSON.stringify({}),
          })
          const missingBody = await missingToken.text()
          let missingPayload
          try { missingPayload = JSON.parse(missingBody) } catch { missingPayload = null }
          if (missingToken.status !== 401 || missingPayload?.error !== 'Sign in is required.') {
            throw new Error('Assessment function expected its missing-token HTTP 401 response, received HTTP ' + missingToken.status + ': ' + missingBody.slice(0, 180))
          }

          const invalidToken = await fetch(endpoint, {
            method: 'POST',
            headers: { ...commonHeaders, Authorization: 'Bearer invalid.invalid.invalid' },
            body: JSON.stringify({}),
          })
          if (invalidToken.status !== 401) {
            const detail = (await invalidToken.text()).slice(0, 180)
            throw new Error('Assessment function must reject invalid JWTs with HTTP 401, received HTTP ' + invalidToken.status + ': ' + detail)
          }

          console.log('Assessment endpoint is deployed; missing and invalid learner credentials are rejected with HTTP 401.')
          NODE
      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || vars.VITE_SUPABASE_ANON_KEY }}
        run: npm run build
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
