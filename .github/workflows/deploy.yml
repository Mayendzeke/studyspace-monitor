name: Deploy Studyspace Monitor

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Report dependency audit
        run: |
          npm audit --json > audit-all.json || true
          npm audit --omit=dev --json > audit-production.json || true
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          for (const [label, file] of [['all dependencies', 'audit-all.json'], ['production dependencies', 'audit-production.json']]) {
            const report = JSON.parse(readFileSync(file, 'utf8'))
            const vulnerabilities = Object.entries(report.vulnerabilities || {})
            console.log(label + ': ' + vulnerabilities.length + ' vulnerable package(s)')
            for (const [name, item] of vulnerabilities) {
              const titles = (item.via || []).filter(value => typeof value === 'object').map(value => value.title).join('; ')
              console.log(' - ' + name + ' [' + item.severity + '] direct=' + item.isDirect + ' fix=' + JSON.stringify(item.fixAvailable) + (titles ? ' ' + titles : ''))
            }
          }
          NODE
      - name: Validate Supabase frontend configuration
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          node --input-type=module <<'NODE'
          const url = process.env.VITE_SUPABASE_URL?.trim()
          const key = process.env.VITE_SUPABASE_PUBLISHABLE_KEY?.trim()

          if (!url || !key) {
            throw new Error('Missing VITE_SUPABASE_URL or public Supabase API key. Check GitHub Actions Variables.')
          }

          let parsedUrl
          try {
            parsedUrl = new URL(url)
          } catch {
            throw new Error('VITE_SUPABASE_URL is not a valid URL.')
          }

          if (parsedUrl.protocol !== 'https:' || parsedUrl.hostname !== 'tibcoottzstnqkfpwabk.supabase.co') {
            throw new Error('VITE_SUPABASE_URL does not match the configured Studyspace production project.')
          }

          const isPublishableKey = /^sb_publishable_[A-Za-z0-9_-]{20,}$/.test(key)
          const isLegacyAnonJwt = /^eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$/.test(key)
          if (!isPublishableKey && !isLegacyAnonJwt) {
            throw new Error('The Supabase public key is missing or has an unsupported format. Copy the complete publishable key from the correct project.')
          }

          console.log('Supabase project URL and public-key format validated. Key value was not printed.')
          NODE
      - name: Verify assessment Edge Function authentication
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          node --input-type=module <<'NODE'
          const url = process.env.VITE_SUPABASE_URL?.trim()
          const key = process.env.VITE_SUPABASE_PUBLISHABLE_KEY?.trim()
          const endpoint = url + '/functions/v1/submit-exercise-attempt'
          const commonHeaders = {
            apikey: key,
            'Content-Type': 'application/json',
            Origin: 'https://mayendzeke.github.io',
          }

          const missingToken = await fetch(endpoint, {
            method: 'POST',
            headers: commonHeaders,
            body: JSON.stringify({}),
          })
          const missingBody = await missingToken.text()
          let missingPayload
          try { missingPayload = JSON.parse(missingBody) } catch { missingPayload = null }
          if (missingToken.status !== 401 || missingPayload?.error !== 'Sign in is required.') {
            throw new Error('Assessment function expected its missing-token HTTP 401 response, received HTTP ' + missingToken.status + ': ' + missingBody.slice(0, 180))
          }

          const invalidToken = await fetch(endpoint, {
            method: 'POST',
            headers: { ...commonHeaders, Authorization: 'Bearer invalid.invalid.invalid' },
            body: JSON.stringify({}),
          })
          if (invalidToken.status !== 401) {
            const detail = (await invalidToken.text()).slice(0, 180)
            throw new Error('Assessment function must reject invalid JWTs with HTTP 401, received HTTP ' + invalidToken.status + ': ' + detail)
          }

          console.log('Assessment endpoint is deployed; missing and invalid learner credentials are rejected with HTTP 401.')
          NODE
      - name: Verify learner account management requires authentication
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          node --input-type=module <<'NODE'
          const url = process.env.VITE_SUPABASE_URL?.trim()
          const key = process.env.VITE_SUPABASE_PUBLISHABLE_KEY?.trim()
          const endpoint = url + '/functions/v1/manage-learner-account'
          const headers = {
            apikey: key,
            'Content-Type': 'application/json',
            Origin: 'https://mayendzeke.github.io',
          }

          const missingToken = await fetch(endpoint, {
            method: 'POST',
            headers,
            body: JSON.stringify({ learnerId: '00000000-0000-4000-8000-000000000000', action: 'delete' }),
          })
          if (missingToken.status !== 401) {
            const detail = (await missingToken.text()).slice(0, 180)
            throw new Error('Learner management must reject missing credentials with HTTP 401, received HTTP ' + missingToken.status + ': ' + detail)
          }

          const invalidToken = await fetch(endpoint, {
            method: 'POST',
            headers: { ...headers, Authorization: 'Bearer invalid.invalid.invalid' },
            body: JSON.stringify({ learnerId: '00000000-0000-4000-8000-000000000000', action: 'delete' }),
          })
          if (invalidToken.status !== 401) {
            const detail = (await invalidToken.text()).slice(0, 180)
            throw new Error('Learner management must reject invalid credentials with HTTP 401, received HTTP ' + invalidToken.status + ': ' + detail)
          }

          console.log('Learner account management rejects both missing and invalid authentication tokens.')
          NODE
      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || vars.VITE_SUPABASE_ANON_KEY }}
          VITE_STUDYSPACE_MEET_DOMAIN: ${{ vars.STUDYSPACE_MEET_DOMAIN }}
          VITE_STUDYSPACE_PUBLIC_ENROLMENT_ENABLED: ${{ vars.VITE_STUDYSPACE_PUBLIC_ENROLMENT_ENABLED || 'false' }}
          VITE_STUDYSPACE_ADMIN_MIA_ENABLED: ${{ vars.VITE_STUDYSPACE_ADMIN_MIA_ENABLED || 'false' }}
        run: npm run build
      - name: Verify Monitor PWA and MIA lesson handoff
        run: |
          node --input-type=module <<'NODE'
          import { existsSync, readFileSync, readdirSync } from 'node:fs'
          import { join } from 'node:path'

          const files = readdirSync('dist')
          const manifestName = files.find(name => name.endsWith('.webmanifest'))
          if (!manifestName) throw new Error('The PWA web app manifest was not generated.')
          const manifest = JSON.parse(readFileSync(join('dist', manifestName), 'utf8'))
          if (manifest.name !== 'Studyspace Monitor' || manifest.start_url !== '/studyspace-monitor/' || manifest.scope !== '/studyspace-monitor/') {
            throw new Error('The Monitor PWA manifest has an unexpected app name, start URL or scope.')
          }
          if (!Array.isArray(manifest.icons) || !manifest.icons.length) throw new Error('The PWA manifest has no app icons.')
          for (const icon of manifest.icons) {
            const relative = String(icon.src).replace('/studyspace-monitor/', '')
            if (!existsSync(join('dist', relative))) throw new Error('A declared PWA icon is missing from the build: ' + icon.src)
          }
          if (!files.includes('sw.js')) throw new Error('The offline service worker was not generated.')
          const app = readFileSync('src/App.tsx', 'utf8')
          const mia = readFileSync('src/components/MiaStudio.tsx', 'utf8')
          const classroom = readFileSync('src/components/ClassroomStudio.tsx', 'utf8')
          if (!app.includes('beforeinstallprompt') || !app.includes('monitor-install-button')) throw new Error('The Monitor install control is missing.')
          if (!mia.includes('studyspace-monitor-mia-lesson-handoff-v1') || !mia.includes('studyspace-open-classroom-studio')) throw new Error('MIA lesson handoff is incomplete.')
          if (!classroom.includes('studyspace-monitor-mia-lesson-handoff-v1') || !classroom.includes('studyspace-open-classroom-studio')) throw new Error('Classroom Studio lesson handoff receiver is incomplete.')
          if (!classroom.includes("extractSection('Learning objectives')") || !classroom.includes("extractSection('Homework')")) throw new Error('MIA lesson sections are not mapped into editable Classroom Studio fields.')
          console.log('Monitor PWA manifest, icon, service worker and MIA-to-Classroom handoff checks passed.')
          NODE
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
